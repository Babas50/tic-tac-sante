name: Compiler l'APK Tic-Tac Santé

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Clé de signature (secrets GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents. Ajoutez ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK Tic-Tac Santé
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk tic-tac-sante.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Version
        id: v
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "tag=v$NAME-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Tic-Tac Santé $NAME (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: tic-tac-sante.apk
          body: |
            Téléchargez **tic-tac-sante.apk** ci-dessous et ouvrez-le sur votre téléphone Android.
            Le mode d'emploi d'installation est dans le README du dépôt.

            Modifications : ${{ github.event.head_commit.message }}
